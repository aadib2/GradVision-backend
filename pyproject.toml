[project]
name = "gradvision-backend"
version = "0.1.0"
description = "Backend server implementation for GradVision."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=4.2.0",
    "beautifulsoup4>=4.12.0",
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
